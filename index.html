/* =====================================================================
   與雲端模組溝通的橋接（Firebase 部分見下方 script）
   ===================================================================== */
const PIECE = {
  class: c => ({ name: c.name, created: c.created, settings: c.settings, groups: c.groups, roles: c.roles, links: c.links, session: c.session, settled: c.settled }),
  student: s => ({ id: s.id, no: s.no, name: s.name, gid: s.gid || null, order: s.order ?? s.no, oldPts: s.oldPts ?? null, converted: !!s.converted }),
  log: l => ({ id: l.id, t: l.t, op: l.op || '', session: l.session, sid: l.sid || null, gid: l.gid || null, type: l.type, pts: l.pts, reason: l.reason || '' }),
  seat: c => ({ img: c.seat })
};
function allPieces(c) {
  const m = {}, b = 'classes/' + c.id;
  m[b] = PIECE.class(c);
  c.students.forEach(s => m[`${b}/students/${s.id}`] = PIECE.student(s));
  c.logs.forEach(l => m[`${b}/logs/${l.id}`] = PIECE.log(l));
  if (c.seat) m[`${b}/seat/main`] = PIECE.seat(c);
  return m;
}
let pendingRender = false, refreshT = null;
document.addEventListener('focusout', () => { if (pendingRender) setTimeout(() => { const a = document.activeElement; if (!(a && /INPUT|TEXTAREA|SELECT/.test(a.tagName))) { pendingRender = false; render(); } }, 80); });
window.__app = {
  db: () => DB,
  getClass: id => DB.classes[id],
  ensureClass(id) {
    if (!DB.classes[id]) { const c = newClass(''); c.id = id; c.groups = []; c.name = '…'; DB.classes[id] = c; }
    return DB.classes[id];
  },
  applyMeta(c, d) {
    c.name = d.name ?? c.name; c.created = d.created ?? c.created; c.settings = d.settings || c.settings; c.groups = d.groups || [];
    c.roles = { teacher: null, notes: '', personal: [], scorers: [], leaders: {}, round: 1, roundStart: ymd(), history: [], ...(d.roles || {}) };
    c.links = d.links || []; c.session = d.session || 1; c.settled = d.settled || {};
  },
  removeClass(id) { if (DB.classes[id]) { delete DB.classes[id]; if (UI.classId === id) UI.classId = null; } },
  upsertStudent(c, d) { const i = c.students.findIndex(s => s.id === d.id); if (i >= 0) Object.assign(c.students[i], d); else c.students.push({ ...d }); return d; },
  removeStudent(c, id) { c.students = c.students.filter(s => s.id !== id); },
  upsertLog(c, d) { const i = c.logs.findIndex(l => l.id === d.id); if (i >= 0) c.logs[i] = { ...d }; else c.logs.push({ ...d }); return d; },
  removeLog(c, id) { c.logs = c.logs.filter(l => l.id !== id); },
  setSeat(c, img) { c.seat = img || null; },
  pieceObj(c, kind, id) {
    if (kind === 'class') return PIECE.class(c);
    if (kind === 'seat') return PIECE.seat(c);
    if (kind === 'student') return PIECE.student(c.students.find(s => s.id === id));
    return PIECE.log(c.logs.find(l => l.id === id));
  },
  allPieces,
  clearAll() { DB = { v: 1, classes: {}, touched: false }; UI.classId = null; },
  seed() { const s = seedDB(); DB.classes = s.classes; },
  refresh() {
    clearTimeout(refreshT);
    refreshT = setTimeout(() => {
      Object.values(DB.classes).forEach(recompute); persistLocal();
      const a = document.activeElement;
      if (a && /INPUT|TEXTAREA|SELECT/.test(a.tagName) && $('#app').contains(a)) { pendingRender = true; return; }
      render();
    }, 60);
  },
  setSync, setUser, toast, confirm: confirmBox, alert: alertBox
};

/* 啟動 */
render();
</script>

<script>
/* =====================================================================
   Firebase 雲端同步（Authentication：Google 登入；Cloud Firestore：即時同步＋離線快取）
   資料結構：users/{uid}/classes/{classId}
               ├ 班級文件：名稱、設定、組別、角色、連結、節次、結算狀態
               ├ students/{id}  每位學生一份文件
               ├ logs/{id}      每筆加扣分／結算／兌換紀錄一份文件
               └ seat/main      座位表圖片（壓縮後 base64，<700KB）
   沒填 firebaseConfig 時，這段不會啟動，系統以純本機模式運作。
   ===================================================================== */
(function () {
  const A = window.__app, cfg = window.FIREBASE_CONFIG;
  if (!cfg || !cfg.apiKey) { A.setSync('nocfg'); return; }
  let fb = null, auth, db, user = null, active = false, pending = 0, cache = {}, unsubs = [], subs = {}, pushT = null, seeded = false;

  const status = () => { if (user) A.setSync(!navigator.onLine ? 'offline' : pending > 0 ? 'syncing' : 'synced'); };
  addEventListener('online', status); addEventListener('offline', status);
  const track = p => { pending++; status(); p.then(() => { pending--; status(); }, e => { pending--; console.warn(e); status(); }); };

  async function boot() {
    try {
      const V = '10.12.2', base = `https://www.gstatic.com/firebasejs/${V}/`;
      const [appM, authM, fsM] = await Promise.all([import(base + 'firebase-app.js'), import(base + 'firebase-auth.js'), import(base + 'firebase-firestore.js')]);
      fb = { ...authM, ...fsM };
      const app = appM.initializeApp(cfg);
      auth = authM.getAuth(app);
      try { db = fsM.initializeFirestore(app, { localCache: fsM.persistentLocalCache({ tabManager: fsM.persistentMultipleTabManager() }) }); }
      catch (e) { console.warn('離線快取無法啟用', e); db = fsM.getFirestore(app); }
    } catch (e) { console.warn(e); A.toast('無法載入 Firebase（可能沒有網路），先以本機模式運作'); A.setSync('local'); return; }
    fb.onAuthStateChanged(auth, onUser);
  }

  window.__cloudLogin = async () => {
    if (location.protocol === 'file:') { A.alert('Google 登入無法在直接雙擊開啟的檔案（file://）上使用。\n\n請把網頁放到 GitHub Pages / Firebase Hosting 等網站空間，或在資料夾內執行\npython -m http.server 8000\n再開啟 http://localhost:8000/ 。', '需要用網址開啟'); return; }
    if (!fb) { A.toast('Firebase 尚未載入完成'); return; }
    try { await fb.signInWithPopup(auth, new fb.GoogleAuthProvider()); }
    catch (e) { if (e.code !== 'auth/popup-closed-by-user' && e.code !== 'auth/cancelled-popup-request') A.alert('登入失敗：' + (e.code || e.message) + '\n請確認 Authentication 已啟用 Google，且「已授權的網域」包含目前網址。', '登入失敗'); }
  };
  window.__cloudLogout = async () => {
    if (await A.confirm('登出後，這台電腦仍保留已同步的資料，但不會再與雲端同步。\n確定登出？', { ok: '登出' })) await fb.signOut(auth);
  };

  function stopAll() { unsubs.forEach(u => u()); unsubs = []; Object.values(subs).forEach(l => l.forEach(u => u())); subs = {}; }

  async function onUser(u) {
    stopAll(); user = u; active = false; cache = {}; seeded = false;
    if (!u) { A.setUser(null); A.setSync('local'); return; }
    A.setUser(u); A.setSync('syncing');
    const key = 'cc_cloud_choice_' + u.uid, D = A.db();
    if (!localStorage.getItem(key)) {
      if (D.touched && Object.keys(D.classes).length) {
        const up = await A.confirm('偵測到這台電腦的瀏覽器裡已經有班級資料。\n\n要把這些資料上傳到你的雲端帳號嗎？\n（選「不上傳」會改用雲端上的資料，這台電腦的舊資料將從畫面移除。）', { title: '上傳本機資料到雲端？', ok: '上傳到雲端' });
        if (up) localStorage.setItem(key, 'up');
        else {
          if (!(await A.confirm('確定不上傳？這台電腦的舊資料會被捨棄（若尚未備份，建議先取消登入並到首頁匯出備份）。', { danger: true, ok: '捨棄本機資料' }))) { await fb.signOut(auth); return; }
          localStorage.setItem(key, 'skip'); A.clearAll();
        }
      } else { localStorage.setItem(key, 'fresh'); A.clearAll(); }
    }
    active = true; listen();
    setTimeout(() => window.__cloudPush(), 1500);   // 補上傳本機尚未在雲端的資料
    A.refresh();
  }

  /* ----- 上傳：只送出和上次不同的文件，並刪除已不存在的文件 ----- */
  window.__cloudPush = () => { if (!user || !active) return; clearTimeout(pushT); pushT = setTimeout(doPush, 250); };
  function doPush() {
    if (!user || !active) return;
    const base = `users/${user.uid}/`, seen = new Set();
    Object.values(A.db().classes).forEach(c => {
      Object.entries(A.allPieces(c)).forEach(([path, obj]) => {
        seen.add(path); const str = JSON.stringify(obj);
        if (cache[path] !== str) { cache[path] = str; track(fb.setDoc(fb.doc(db, base + path), JSON.parse(str))); }
      });
    });
    Object.keys(cache).forEach(path => { if (!seen.has(path)) { delete cache[path]; track(fb.deleteDoc(fb.doc(db, base + path))); } });
  }

  /* ----- 下載：onSnapshot 即時同步 ----- */
  function listen() {
    const base = `users/${user.uid}/classes`;
    unsubs.push(fb.onSnapshot(fb.collection(db, base), snap => {
      snap.docChanges().forEach(ch => {
        const id = ch.doc.id;
        if (ch.type === 'removed') { (subs[id] || []).forEach(u => u()); delete subs[id]; Object.keys(cache).forEach(k => { if (k.startsWith('classes/' + id)) delete cache[k]; }); A.removeClass(id); return; }
        const c = A.ensureClass(id); A.applyMeta(c, ch.doc.data());
        cache['classes/' + id] = JSON.stringify(A.pieceObj(c, 'class'));
        if (!subs[id]) listenClass(id);
      });
      if (!seeded && !snap.metadata.fromCache && snap.empty && !Object.keys(A.db().classes).length) { seeded = true; A.seed(); window.__cloudPush(); }
      A.refresh(); status();
    }, err => { console.warn(err); A.toast('雲端讀取失敗：' + err.code); }));
  }
  function listenClass(id) {
    const base = `users/${user.uid}/classes/${id}`, list = [];
    const sub = (name, onAdd, onDel) => list.push(fb.onSnapshot(fb.collection(db, `${base}/${name}`), snap => {
      const c = A.getClass(id); if (!c) return;
      snap.docChanges().forEach(ch => {
        const path = `classes/${id}/${name}/${ch.doc.id}`;
        if (ch.type === 'removed') { onDel(c, ch.doc.id); delete cache[path]; } else { onAdd(c, { ...ch.doc.data(), id: ch.doc.id }, path); }
      });
      A.refresh(); status();
    }, err => console.warn(name, err)));
    sub('students', (c, d, path) => { A.upsertStudent(c, d); cache[path] = JSON.stringify(A.pieceObj(c, 'student', d.id)); }, (c, i) => A.removeStudent(c, i));
    sub('logs', (c, d, path) => { A.upsertLog(c, d); cache[path] = JSON.stringify(A.pieceObj(c, 'log', d.id)); }, (c, i) => A.removeLog(c, i));
    sub('seat', (c, d, path) => { A.setSeat(c, d.img); cache[path] = JSON.stringify(A.pieceObj(c, 'seat')); }, (c) => A.setSeat(c, null));
    subs[id] = list;
  }

  A.setSync('local');
  boot();
})();
</script>
